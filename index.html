<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Index | Charisma Gamboa</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav>
  <a href="#" onclick="showSection('register')">Register</a>
  <a href="#" onclick="showSection('login')">Login</a>
</nav>

<!-- Register Section -->
<section id="register" class="form-section">
  <h2>Create Your Account 💖</h2>
  <form onsubmit="saveUser(event)">
    <label for="regEmail">Email</label>
    <input type="email" id="regEmail" required>

    <label for="regUsername">Username</label>
    <input type="text" id="regUsername" required>

    <label for="regPassword">Password</label>
    <input type="password" id="regPassword" required>

    <button type="submit">Register</button>
  </form>
  <p>Already have an account? <a href="#" onclick="showSection('login')">Login here</a></p>
</section>

<!-- Login Section -->
<section id="login" class="form-section" style="display:none;">
  <h2>Welcome Back 💕</h2>
  
  <!-- Username/Password Login -->
  <form id="loginForm">
    <label for="loginUsername">Username</label>
    <input type="text" id="loginUsername" required>

    <label for="loginPassword">Password</label>
    <input type="password" id="loginPassword" required>

    <button type="button" onclick="checkLogin()">Login</button>
  </form>

  <!-- OTP Section -->
  <form id="otpForm" style="display:none;">
    <h3>Enter OTP 🔑</h3>
    <p id="otpMessage"></p>
    <label for="otp">One-Time Password</label>
    <input type="text" id="otp" required>
    <button type="button" onclick="verifyOtp()">Verify</button>
  </form>

  <!-- Google Sign-In -->
  <div id="googleSection" class="google-signin">
    <h3>Or sign in with:</h3>
    <button type="button" onclick="googleLogin()">Sign in with Google</button>
  </div>

  <p>Don’t have an account yet? <a href="#" onclick="showSection('register')">Register here</a></p>
</section>

<footer>
  © 2026 Charisma T. Gamboa
</footer>

<script>
  let currentOtp = "";

  function showSection(sectionId) {
    document.getElementById('register').style.display = 'none';
    document.getElementById('login').style.display = 'none';
    document.getElementById(sectionId).style.display = 'block';
  }

  function saveUser(event) {
    event.preventDefault();
    const email = document.getElementById('regEmail').value.trim();
    const username = document.getElementById('regUsername').value.trim();
    const password = document.getElementById('regPassword').value.trim();

    localStorage.setItem('registeredEmail', email);
    localStorage.setItem('registeredUsername', username);
    localStorage.setItem('registeredPassword', password);

    alert("Registration successful!");
    showSection('login');
  }

  function checkLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();

    const regUser = localStorage.getItem('registeredUsername');
    const regPass = localStorage.getItem('registeredPassword');

    if (username === regUser && password === regPass) {
      generateOtp("Login successful! Your OTP code is: ");
    } else {
      alert("Invalid username or password. Please try again.");
    }
  }

  function generateOtp(messagePrefix) {
    currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
    document.getElementById('otp').value = "";

    document.getElementById('loginForm').style.display = 'none';
    document.getElementById('otpForm').style.display = 'block';
    document.getElementById('googleSection').style.display = 'none';

    document.getElementById('otpMessage').innerText = messagePrefix + currentOtp;
  }

  function verifyOtp() {
    const enteredOtp = document.getElementById('otp').value;
    if (enteredOtp === currentOtp) {
      alert("Login successful!");
      window.location.href = "home.html";
    } else {
      alert("Invalid OTP. Please try again.");
    }
  }

  function googleLogin() {
    generateOtp("Google login successful! Your OTP code is: ");
  }
</script>

</body>
</html>
